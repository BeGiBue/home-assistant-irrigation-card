name: Publish Irrigation 2.0.0 after validation

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish approved release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" == "2.0.0" ]] || { echo "Version not approved"; exit 0; }
          test -s RELEASE_NOTES_2.0.0.md
          node --check irrigation-card.js
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [[ "$MAIN_SHA" == "$SOURCE_SHA" ]] || { echo "Main moved; skip stale release"; exit 0; }
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released"; exit 0
          fi
          gh release create v2.0.0 irrigation-card.js --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Irrigation Card 2.0.0" --notes-file RELEASE_NOTES_2.0.0.md --latest
